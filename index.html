<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI HUB — AI 서비스 모음</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #090910;
  --bg2: #0f0f1a;
  --bg3: #14142a;
  --card: #16162a;
  --card-h: #1c1c38;
  --border: rgba(255,255,255,0.07);
  --border-h: rgba(120,100,255,0.35);
  --txt: #e2e2f0;
  --txt2: #7878a0;
  --txt3: #4e4e70;
  --purple: #7c6fff;
  --purple2: #a89bff;
  --pink: #ff5fa0;
  --cyan: #3de8c8;
  --orange: #ff8c42;
  --green: #41e08e;
  --yellow: #f5c542;
  --sidebar-w: 230px;
  --header-h: 62px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);
  color:var(--txt);
  min-height:100vh;
  overflow-x:hidden;
}

/* ──────────────── HEADER ──────────────── */
header{
  position:fixed;top:0;left:0;right:0;
  height:var(--header-h);
  background:rgba(9,9,16,0.88);
  backdrop-filter:blur(24px);
  -webkit-backdrop-filter:blur(24px);
  border-bottom:1px solid var(--border);
  z-index:200;
  display:flex;align-items:center;
  padding:0 20px 0 24px;
  gap:0;
}
.logo{
  display:flex;align-items:center;gap:10px;
  font-size:18px;font-weight:800;
  letter-spacing:-0.03em;
  margin-right:36px;
  flex-shrink:0;
  text-decoration:none;
}
.logo-icon{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,#7c6fff 0%,#ff5fa0 100%);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;
}
.logo-text{
  background:linear-gradient(135deg,#a89bff,#ff7eb8);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}

/* top nav tabs */
.top-nav{
  display:flex;gap:2px;
  flex:1;
  overflow-x:auto;
}
.top-nav::-webkit-scrollbar{display:none;}
.tnav{
  padding:7px 18px;border-radius:8px;
  cursor:pointer;font-size:13.5px;font-weight:500;
  color:var(--txt2);
  transition:all .18s;
  white-space:nowrap;border:none;background:transparent;
  letter-spacing:-0.01em;
}
.tnav:hover{color:var(--txt);background:rgba(255,255,255,0.05);}
.tnav.active{
  color:#fff;
  background:linear-gradient(135deg,rgba(124,111,255,.22),rgba(255,95,160,.12));
  border:1px solid rgba(124,111,255,.3);
}

/* search */
.search-box{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.05);
  border:1px solid var(--border);
  border-radius:9px;padding:7px 14px;
  margin-left:12px;flex-shrink:0;
}
.search-box input{
  background:transparent;border:none;outline:none;
  color:var(--txt);font-size:13px;width:160px;
}
.search-box input::placeholder{color:var(--txt3);}
.search-icon{color:var(--txt3);font-size:14px;}

/* ──────────────── LAYOUT ──────────────── */
.layout{
  display:flex;
  padding-top:var(--header-h);
  min-height:100vh;
}

/* ──────────────── SIDEBAR ──────────────── */
aside{
  width:var(--sidebar-w);
  position:fixed;top:var(--header-h);left:0;bottom:0;
  background:var(--bg2);
  border-right:1px solid var(--border);
  padding:20px 10px 32px;
  overflow-y:auto;
  z-index:100;
}
aside::-webkit-scrollbar{width:3px;}
aside::-webkit-scrollbar-track{background:transparent;}
aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px;}

.side-label{
  font-size:10.5px;font-weight:600;
  text-transform:uppercase;letter-spacing:.09em;
  color:var(--txt3);padding:10px 12px 6px;
  margin-top:8px;
}
.side-label:first-child{margin-top:0;}

.sitem{
  display:flex;align-items:center;gap:9px;
  padding:8px 12px;border-radius:8px;
  cursor:pointer;font-size:13px;font-weight:500;
  color:var(--txt2);transition:all .16s;
  border:none;background:transparent;width:100%;text-align:left;
}
.sitem:hover{background:rgba(255,255,255,.05);color:var(--txt);}
.sitem.active{
  background:rgba(124,111,255,.13);
  color:var(--purple2);
}
.sitem .dot{
  width:8px;height:8px;border-radius:50%;flex-shrink:0;
}
.sitem .cnt{
  margin-left:auto;font-size:11px;font-weight:600;
  background:rgba(255,255,255,.06);
  color:var(--txt3);
  padding:2px 7px;border-radius:10px;
}
.sitem.active .cnt{
  background:rgba(124,111,255,.18);color:var(--purple2);
}

.side-divider{height:1px;background:var(--border);margin:12px 10px;}

/* ──────────────── MAIN ──────────────── */
main{
  flex:1;
  margin-left:var(--sidebar-w);
  padding:32px 32px 60px;
  min-width:0;
}

.page-head{
  margin-bottom:28px;
}
.page-title{
  font-size:22px;font-weight:700;letter-spacing:-.03em;
  margin-bottom:5px;
}
.page-sub{font-size:13px;color:var(--txt2);}
.page-count{
  display:inline-flex;align-items:center;
  gap:5px;margin-top:10px;
  font-size:12px;color:var(--txt2);
}
.page-count span{
  background:rgba(124,111,255,.15);
  color:var(--purple2);padding:2px 9px;border-radius:10px;
  font-weight:600;
}

/* ──────────────── CARDS ──────────────── */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(255px,1fr));
  gap:18px;
}

.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;padding:22px;
  cursor:pointer;
  transition:transform .22s cubic-bezier(.23,1,.32,1),
             box-shadow .22s,border-color .22s,background .18s;
  position:relative;overflow:hidden;
  text-decoration:none;display:flex;flex-direction:column;
  color:inherit;
}
.card::after{
  content:'';position:absolute;
  inset:0;border-radius:16px;
  background:var(--card-glow,radial-gradient(circle at 70% 0%,rgba(124,111,255,.08),transparent 60%));
  opacity:0;transition:opacity .3s;pointer-events:none;
}
.card:hover{
  background:var(--card-h);
  border-color:var(--border-h);
  transform:translateY(-4px);
  box-shadow:0 16px 48px rgba(0,0,0,.55),0 0 0 1px rgba(124,111,255,.15);
}
.card:hover::after{opacity:1;}

/* top accent line */
.card-top-line{
  position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:16px 16px 0 0;
  background:var(--line-grad,linear-gradient(90deg,#7c6fff,#ff5fa0));
  opacity:0;transition:opacity .25s;
}
.card:hover .card-top-line{opacity:1;}

.card-icon{
  width:46px;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;margin-bottom:15px;flex-shrink:0;
  position:relative;z-index:1;
  background:var(--icon-bg,rgba(124,111,255,.12));
  border:1px solid rgba(255,255,255,.06);
}
.card-name{
  font-size:15.5px;font-weight:700;margin-bottom:5px;
  letter-spacing:-.02em;position:relative;z-index:1;
}
.card-desc{
  font-size:12.5px;color:var(--txt2);line-height:1.65;
  flex:1;position:relative;z-index:1;margin-bottom:18px;
}
.card-foot{
  display:flex;align-items:center;justify-content:space-between;
  position:relative;z-index:1;
}
.card-tag{
  font-size:11px;font-weight:600;
  padding:3px 10px;border-radius:20px;
  background:var(--tag-bg,rgba(124,111,255,.12));
  color:var(--tag-c,var(--purple2));
  letter-spacing:.01em;
}
.card-arrow{
  font-size:15px;color:var(--txt3);
  transition:transform .2s,color .2s;
}
.card:hover .card-arrow{transform:translateX(5px);color:var(--txt);}

/* new badge */
.card-new{
  position:absolute;top:14px;right:14px;
  font-size:9.5px;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;
  background:linear-gradient(135deg,#7c6fff,#ff5fa0);
  color:#fff;padding:2px 8px;border-radius:20px;
}

/* empty state */
.empty{
  grid-column:1/-1;
  padding:80px 20px;text-align:center;
  color:var(--txt2);
}
.empty-icon{font-size:48px;margin-bottom:16px;opacity:.4;}
.empty-text{font-size:15px;}

/* ──────────────── COLOR THEMES ──────────────── */
.t-purple{--card-glow:radial-gradient(circle at 70% 0%,rgba(124,111,255,.1),transparent 60%);
  --line-grad:linear-gradient(90deg,#7c6fff,#a89bff);
  --icon-bg:rgba(124,111,255,.14);
  --tag-bg:rgba(124,111,255,.12);--tag-c:#a89bff;}
.t-pink{--card-glow:radial-gradient(circle at 70% 0%,rgba(255,95,160,.08),transparent 60%);
  --line-grad:linear-gradient(90deg,#ff5fa0,#ffb3d4);
  --icon-bg:rgba(255,95,160,.12);
  --tag-bg:rgba(255,95,160,.1);--tag-c:#ff8ac0;}
.t-cyan{--card-glow:radial-gradient(circle at 70% 0%,rgba(61,232,200,.07),transparent 60%);
  --line-grad:linear-gradient(90deg,#3de8c8,#00bfff);
  --icon-bg:rgba(61,232,200,.1);
  --tag-bg:rgba(61,232,200,.1);--tag-c:#3de8c8;}
.t-orange{--card-glow:radial-gradient(circle at 70% 0%,rgba(255,140,66,.08),transparent 60%);
  --line-grad:linear-gradient(90deg,#ff8c42,#ffbf6a);
  --icon-bg:rgba(255,140,66,.12);
  --tag-bg:rgba(255,140,66,.1);--tag-c:#ffaa6a;}
.t-green{--card-glow:radial-gradient(circle at 70% 0%,rgba(65,224,142,.07),transparent 60%);
  --line-grad:linear-gradient(90deg,#41e08e,#a8f5d0);
  --icon-bg:rgba(65,224,142,.1);
  --tag-bg:rgba(65,224,142,.1);--tag-c:#41e08e;}
.t-yellow{--card-glow:radial-gradient(circle at 70% 0%,rgba(245,197,66,.07),transparent 60%);
  --line-grad:linear-gradient(90deg,#f5c542,#ffe48a);
  --icon-bg:rgba(245,197,66,.1);
  --tag-bg:rgba(245,197,66,.1);--tag-c:#f5c542;}
.t-blue{--card-glow:radial-gradient(circle at 70% 0%,rgba(66,153,255,.08),transparent 60%);
  --line-grad:linear-gradient(90deg,#4299ff,#7ecbff);
  --icon-bg:rgba(66,153,255,.12);
  --tag-bg:rgba(66,153,255,.1);--tag-c:#7ecbff;}

/* ──────────────── RESPONSIVE ──────────────── */
@media(max-width:900px){
  aside{transform:translateX(-100%);transition:transform .25s;}
  aside.open{transform:translateX(0);}
  main{margin-left:0;}
  .menu-btn{display:flex!important;}
}
@media(max-width:600px){
  .cards{grid-template-columns:1fr 1fr;}
}
@media(max-width:460px){
  .cards{grid-template-columns:1fr;}
}
.menu-btn{
  display:none;
  align-items:center;justify-content:center;
  width:36px;height:36px;border-radius:8px;
  background:rgba(255,255,255,.06);border:none;cursor:pointer;
  color:var(--txt);font-size:18px;flex-shrink:0;margin-right:8px;
}
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);
  z-index:99;backdrop-filter:blur(2px);
}
.overlay.show{display:block;}
</style>
</head>
<body>

<div class="overlay" id="overlay"></div>

<!-- ── LAYOUT ── -->
<div class="layout">

  <aside id="sidebar">

  <main>

    <div class="cards" id="cardGrid"></div>

</div>

let state = {cat:"all",sub:null,search:""};

function renderSidebar(){
  const el = document.getElementById("sideContent");
  const cat = state.cat;
  let html = "";

  if(cat==="all"){
    const cfg = SIDEBAR_CONFIG.all;
    html += `<div class="side-label">${cfg.label}</div>`;
    cfg.items.forEach(i=>{
      const cnt = i.key==="all" ? SERVICES.length : SERVICES.filter(s=>s.cat===i.key).length;
      const active = (i.key==="all" && !state.sub) ? "active" : "";
      html += `<button class="sitem ${active}" onclick="handleSide('all','${i.sub||""}','${i.label}')">
        <span class="dot" style="background:${i.dot}"></span>
        ${i.label}
        <span class="cnt">${cnt}</span>
      </button>`;
    });
    cfg.extra.forEach(sec=>{
      html += `<div class="side-divider"></div><div class="side-label">${sec.label}</div>`;
      sec.items.forEach(i=>{
        const cnt = SERVICES.filter(s=>s.isNew).length;
        const active = state.sub==="new" ? "active" : "";
        html += `<button class="sitem ${active}" onclick="handleSide('all','new','신규 서비스')">
          <span class="dot" style="background:${i.dot}"></span>
          ${i.label}
          <span class="cnt">${cnt}</span>
        </button>`;
      });
    });
  } else {
    const cfg = SIDEBAR_CONFIG[cat];
    html += `<button class="sitem" onclick="handleNav('all')" style="margin-bottom:8px;color:var(--txt3)">
      ← 전체 보기
    </button><div class="side-divider"></div>`;
    cfg.sections.forEach(sec=>{
      html += `<div class="side-label">${sec.label}</div>`;
      const totalCnt = SERVICES.filter(s=>s.cat===cat).length;
      const allActive = !state.sub ? "active" : "";
      html += `<button class="sitem ${allActive}" onclick="handleSide('${cat}','','전체')">
        <span class="dot" style="background:#ffffff30"></span>
        전체
        <span class="cnt">${totalCnt}</span>
      </button>`;
      sec.items.forEach(i=>{
        const cnt = SERVICES.filter(s=>s.cat===cat && s.sub===i.sub).length;
        const active = state.sub===i.sub ? "active" : "";
        html += `<button class="sitem ${active}" onclick="handleSide('${cat}','${i.sub}','${i.label}')">
          <span class="dot" style="background:${i.dot}"></span>
          ${i.label}
          <span class="cnt">${cnt}</span>
        </button>`;
      });
    });
  }
  el.innerHTML = html;
}

function renderCards(){
  const grid = document.getElementById("cardGrid");
  const search = state.search.toLowerCase();

  let filtered = SERVICES.filter(s=>{
    if(state.cat==="all"){
      if(state.sub==="new") return s.isNew;
      if(state.sub) return false;
      return true;
    }
    if(s.cat!==state.cat) return false;
    if(state.sub && s.sub!==state.sub) return false;
    return true;
  });

  if(search){
    filtered = filtered.filter(s=>
      s.name.toLowerCase().includes(search)||
      s.desc.toLowerCase().includes(search)||
      s.tag.toLowerCase().includes(search)
    );
  }

  document.getElementById("cardCount").textContent = filtered.length;

  if(!filtered.length){
    grid.innerHTML = `<div class="empty">
      <div class="empty-icon">🔍</div>
      <div class="empty-text">검색 결과가 없습니다.</div>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(s=>`
    <a class="card ${s.theme}" href="${s.url}" target="_blank" rel="noopener noreferrer">
      <div class="card-top-line"></div>
      ${s.isNew ? '<span class="card-new">NEW</span>' : ""}
      <div class="card-icon">${s.icon}</div>
      <div class="card-name">${s.name}</div>
      <div class="card-desc">${s.desc}</div>
      <div class="card-foot">
        <span class="card-tag">${s.tag}</span>
        <span class="card-arrow">→</span>
      </div>
    </a>
  `).join("");
}

function updateMeta(){
  const key = state.sub && state.sub!=="new" ? state.sub : state.cat;
  const meta = PAGE_META[key] || PAGE_META["all"];
  document.getElementById("pageTitle").textContent = meta.title;
  document.getElementById("pageSub").textContent = meta.desc;
}

function handleNav(cat){
  state.cat = cat;
  state.sub = null;
  document.querySelectorAll(".tnav").forEach(b=>{
    b.classList.toggle("active", b.dataset.cat===cat);
  });
  updateMeta();
  renderSidebar();
  renderCards();
}

function handleSide(cat, sub, label){
  state.cat = cat;
  state.sub = sub || null;
  updateMeta();
  renderSidebar();
  renderCards();
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
}

document.querySelectorAll(".tnav").forEach(b=>{
  b.addEventListener("click",()=>handleNav(b.dataset.cat));
});

document.getElementById("searchInput").addEventListener("input",e=>{
  state.search = e.target.value;
  renderCards();
});

document.getElementById("menuBtn").addEventListener("click",()=>{
  document.getElementById("sidebar").classList.toggle("open");
  document.getElementById("overlay").classList.toggle("show");
});
document.getElementById("overlay").addEventListener("click",()=>{
  document.getElementById("sidebar").classList.remove("open");
  document.getElementById("overlay").classList.remove("show");
});

renderSidebar();
renderCards();
</script>
